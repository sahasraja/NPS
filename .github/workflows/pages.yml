name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # false, not true: with cancel-in-progress a manual re-run of an older run
  # kills the newer deploy your push just started, and the site silently stays
  # on the previous build. Queuing them instead means the newest commit always
  # wins, at the cost of a few extra seconds.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate HTML from build.py
        run: python3 build.py

      - name: Fail if generated HTML differs from what was committed
        run: |
          if ! git diff --quiet; then
            echo "::warning::Committed HTML is out of date with build.py, deploying the freshly generated output."
            git diff --stat
          fi

      # enablement:true lets the workflow create the Pages site itself, so a
      # fresh repo (or one whose Pages config was cleared by a visibility change)
      # deploys without anyone having to touch Settings -> Pages first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
